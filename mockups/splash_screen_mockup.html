<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Noted — Splash Screen & Hardware Boot Sequence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f8fafc',
              100: '#f1f5f9',
              200: '#e2e8f0',
              300: '#cbd5e1',
              400: '#94a3b8',
              500: '#64748b',
              600: '#475569',
              700: '#334155',
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            },
            accent: {
              600: '#2563eb',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes salute-bounce {
      0% { transform: translateY(0) scale(1); }
      30% { transform: translateY(-16px) scale(1.08) rotate(-2deg); }
      60% { transform: translateY(4px) scale(0.96) rotate(1deg); }
      100% { transform: translateY(0) scale(1); }
    }
    .robot-salute {
      animation: salute-bounce 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .oled-glow {
      box-shadow: 0 0 28px rgba(56, 189, 248, 0.6), inset 0 0 12px rgba(255, 255, 255, 0.7);
    }
  </style>
</head>
<body class="bg-[#03060f] text-white font-sans min-h-screen flex flex-col justify-between p-6 sm:p-10 select-none overflow-hidden">

  <!-- TOP BRAND STATUS BAR -->
  <header class="flex items-center justify-between border-b border-brand-800/60 pb-4">
    <div class="flex items-center space-x-3">
      <div class="w-8 h-8 rounded-lg bg-accent-600 flex items-center justify-center font-bold text-white shadow-sm">
        <i class="fa-solid fa-microchip text-xs"></i>
      </div>
      <div>
        <span class="font-bold text-sm tracking-wider font-mono">NOTED // BOOT SEQUENCE</span>
        <span class="text-[10px] text-brand-400 block font-mono">HARDWARE DIAGNOSTIC v1.0</span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2 bg-brand-900/80 border border-brand-800 px-3 py-1 rounded-xl text-xs font-mono">
        <span id="system-status-indicator" class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
        <span id="system-status-text" class="text-brand-300">DIAGNOSING...</span>
      </div>
    </div>
  </header>

  <!-- CENTER: WAKING UP ROBOT ANIMATION -->
  <main class="flex flex-col items-center justify-center my-auto space-y-6">
    
    <!-- ROBOT HEAD BEZEL -->
    <div id="robot-head" class="relative bg-gradient-to-b from-[#0c1220] to-[#04060d] border-4 border-[#1e293b] rounded-[52px] w-[340px] h-[230px] flex flex-col items-center justify-center shadow-2xl transition-all duration-500 shadow-black">
      
      <!-- Chamfer glow -->
      <div class="absolute inset-2 rounded-[44px] border border-white/5 pointer-events-none bg-gradient-to-b from-white/[0.04] to-transparent"></div>

      <!-- Glowing Antenna -->
      <div class="absolute -top-7 flex flex-col items-center">
        <div id="antenna-dot" class="w-4 h-4 rounded-full bg-brand-700 transition-all duration-500"></div>
        <div class="w-1.5 h-3.5 bg-brand-700 rounded-b"></div>
      </div>

      <!-- OLED EYES DISPLAY -->
      <div class="relative w-full flex items-center justify-center gap-10">
        
        <!-- LEFT EYE -->
        <div id="eye-left" class="oled-glow bg-sky-400 rounded-[28px] flex items-center justify-center relative overflow-hidden transition-all duration-500 w-[56px] h-[4px] scale-y-50 opacity-40">
          <div id="pupil-left" class="w-7 h-9 bg-[#03060f] rounded-[14px] flex items-center justify-center hidden">
            <div class="w-2.5 h-2.5 bg-white rounded-full self-start mt-1 mr-1"></div>
          </div>
          <div id="happy-left" class="w-10 h-5 border-t-4 border-[#03060f] rounded-t-full mt-3 hidden"></div>
        </div>

        <!-- RIGHT EYE -->
        <div id="eye-right" class="oled-glow bg-sky-400 rounded-[28px] flex items-center justify-center relative overflow-hidden transition-all duration-500 w-[56px] h-[4px] scale-y-50 opacity-40">
          <div id="pupil-right" class="w-7 h-9 bg-[#03060f] rounded-[14px] flex items-center justify-center hidden">
            <div class="w-2.5 h-2.5 bg-white rounded-full self-start mt-1 mr-1"></div>
          </div>
          <div id="happy-right" class="w-10 h-5 border-t-4 border-[#03060f] rounded-t-full mt-3 hidden"></div>
        </div>

      </div>

      <!-- CUTE MOUTH -->
      <div class="mt-4 flex items-center justify-center transition-all duration-300">
        <div id="robot-mouth" class="w-4 h-1 bg-sky-400/80 rounded-full"></div>
      </div>

    </div>

    <!-- STATUS GREETING BUBBLE -->
    <div class="max-w-md w-full bg-brand-900/90 border border-brand-800 rounded-2xl p-4 text-center backdrop-blur-md shadow-xl transition-all">
      <div class="flex items-center justify-center gap-2 mb-1 font-mono text-[11px] text-sky-400 font-semibold tracking-wider uppercase">
        <i class="fa-solid fa-volume-high text-xs"></i>
        <span>Status Asisten</span>
      </div>
      <p id="greeting-text" class="text-sm text-brand-100 font-mono leading-relaxed">
        &ldquo;Memulai inisialisasi kernel Noted...&rdquo;
      </p>
    </div>

  </main>

  <!-- BOTTOM TELEMETRY LOG & CONTROLS -->
  <footer class="grid grid-cols-1 md:grid-cols-12 gap-4 items-end border-t border-brand-800/60 pt-4">
    
    <!-- BOOT LOG TERMINAL -->
    <div id="terminal-log" class="md:col-span-8 bg-brand-950/80 border border-brand-800/80 rounded-xl p-3 font-mono text-[11px] text-brand-400 space-y-1 h-24 overflow-y-auto">
      <div class="text-brand-500 text-[10px] uppercase tracking-wider mb-1">Diagnostic Terminal Output:</div>
      <div id="log-content"></div>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="md:col-span-4 flex items-center gap-2 justify-end">
      <button onclick="runBootSequence()" class="p-2.5 bg-brand-900 hover:bg-brand-800 text-brand-300 border border-brand-700 rounded-xl text-xs font-mono transition flex items-center gap-1" title="Ulangi Boot">
        <i class="fa-solid fa-rotate-left"></i>
      </button>
      <a href="meeting_assistant_mockup.html" class="flex-1 bg-accent-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-accent-600/30 font-mono">
        <span>Masuk Aplikasi</span>
        <i class="fa-solid fa-arrow-right text-xs"></i>
      </a>
    </div>

  </footer>

  <script>
    function addLog(text, isHighlight) {
      const logBox = document.getElementById('log-content');
      const div = document.createElement('div');
      div.className = 'flex items-center gap-2';
      div.innerHTML = `<span class="text-blue-500">&gt;</span> <span class="${isHighlight ? 'text-emerald-400 font-bold' : 'text-brand-300'}">${text}</span>`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function runBootSequence() {
      document.getElementById('log-content').innerHTML = '';
      
      const head = document.getElementById('robot-head');
      const eyeL = document.getElementById('eye-left');
      const eyeR = document.getElementById('eye-right');
      const pupilL = document.getElementById('pupil-left');
      const pupilR = document.getElementById('pupil-right');
      const happyL = document.getElementById('happy-left');
      const happyR = document.getElementById('happy-right');
      const antenna = document.getElementById('antenna-dot');
      const statusInd = document.getElementById('system-status-indicator');
      const statusTxt = document.getElementById('system-status-text');
      const greeting = document.getElementById('greeting-text');

      // Reset
      head.className = 'relative bg-gradient-to-b from-[#0c1220] to-[#04060d] border-4 border-[#1e293b] rounded-[52px] w-[340px] h-[230px] flex flex-col items-center justify-center shadow-2xl transition-all duration-500 shadow-black';
      eyeL.className = 'oled-glow bg-sky-400 rounded-[28px] flex items-center justify-center relative overflow-hidden transition-all duration-500 w-[56px] h-[4px] scale-y-50 opacity-40';
      eyeR.className = 'oled-glow bg-sky-400 rounded-[28px] flex items-center justify-center relative overflow-hidden transition-all duration-500 w-[56px] h-[4px] scale-y-50 opacity-40';
      pupilL.classList.add('hidden');
      pupilR.classList.add('hidden');
      happyL.classList.add('hidden');
      happyR.classList.add('hidden');
      antenna.className = 'w-4 h-4 rounded-full bg-brand-700 transition-all duration-500';
      statusInd.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
      statusTxt.innerText = 'DIAGNOSING...';
      greeting.innerText = '“Memulai inisialisasi kernel Noted...”';

      // Step 1: 500ms
      setTimeout(() => {
        addLog('[BOOT] Noted Acoustic Kernel v1.0 initialized');
        greeting.innerText = '“Memeriksa sensor audio multi-kanal...”';
        antenna.className = 'w-4 h-4 rounded-full bg-sky-400 shadow-lg shadow-sky-400/80 animate-pulse';
      }, 500);

      // Step 2: 1400ms (Eye opens slit to medium)
      setTimeout(() => {
        addLog('[AUDIO] WebRTC 48kHz Acoustic Channel... OK');
        addLog('[MEMORY] 14 Profil Sidik Suara Tim Tersinkronisasi (pgvector)');
        greeting.innerText = '“Menyelaraskan memori sidik suara...”';
        eyeL.className = 'oled-glow bg-sky-400 rounded-[28px] flex items-center justify-center relative overflow-hidden transition-all duration-500 w-[56px] h-[32px] scale-y-75 opacity-80';
        eyeR.className = 'oled-glow bg-sky-400 rounded-[28px] flex items-center justify-center relative overflow-hidden transition-all duration-500 w-[56px] h-[32px] scale-y-75 opacity-80';
        pupilL.classList.remove('hidden');
        pupilR.classList.remove('hidden');
      }, 1400);

      // Step 3: 2200ms (Fully Awake Eyes)
      setTimeout(() => {
        addLog('[AI] LLM Directive & Task Extraction Engine... READY');
        greeting.innerText = '“Mendeteksi orientasi akustik meja...”';
        eyeL.className = 'oled-glow bg-sky-400 rounded-[28px] flex items-center justify-center relative overflow-hidden transition-all duration-500 w-[64px] h-[82px] scale-y-100 opacity-100';
        eyeR.className = 'oled-glow bg-sky-400 rounded-[28px] flex items-center justify-center relative overflow-hidden transition-all duration-500 w-[64px] h-[82px] scale-y-100 opacity-100';
      }, 2200);

      // Step 4: 3000ms (Salute Boss "Siap Boss!")
      setTimeout(() => {
        addLog('[SYSTEM] Status 100% Siap: "Asisten meetingmu boss, noted!"', true);
        head.classList.add('robot-salute');
        antenna.className = 'w-4 h-4 rounded-full bg-emerald-400 shadow-lg shadow-emerald-400/90 scale-125';
        statusInd.className = 'w-2 h-2 rounded-full bg-emerald-400 animate-pulse';
        statusTxt.innerText = 'SYSTEM ONLINE';
        greeting.innerText = '“Noted aktif 100%! Siap mencatat seluruh rapat, Boss!”';
        pupilL.classList.add('hidden');
        pupilR.classList.add('hidden');
        happyL.classList.remove('hidden');
        happyR.classList.remove('hidden');
      }, 3000);
    }

    // Auto run boot on page load
    window.onload = runBootSequence;
  </script>
</body>
</html>
